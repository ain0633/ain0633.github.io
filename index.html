<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ainsof.dev</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #fde7ef 0%, #f7f1ff 50%, #e9f3ff 100%);
      color: #3a2a33;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -0.02em; }
    p.tag { margin-top: 0.6rem; color: #8a6b78; font-size: 1.05rem; }
    .links { margin-top: 2.4rem; display: flex; flex-direction: column; gap: 0.9rem; align-items: center; }
    a.card {
      display: inline-flex; align-items: center; gap: 0.6rem;
      padding: 0.9rem 1.6rem; border-radius: 999px;
      background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px rgba(180,120,150,0.18);
      text-decoration: none; color: #3a2a33; font-weight: 600;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a.card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(180,120,150,0.28); }
    footer { margin-top: 3rem; font-size: 0.85rem; color: #b59aa6; }
  </style>
</head>
<body>
  <main>
    <h1>ainsof.dev</h1>
    <p class="tag">이아인 · 작업실</p>
    <div class="links">
      <a class="card" href="/cherryblossom-timer/">🌸 벚꽃이 지면 — 뽀모도로 타이머</a>
    </div>
    <footer>made with care</footer>
  </main>
</body>
</html>
